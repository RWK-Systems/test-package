; TestPackage preset: Typical desktop app
; NOTE: key names are indicative — map onto the real ConfigModel/ConfigWriter keys.
; Identity is unchanged by presets; presets only set behavior toggles + sample data.

[Files]
Enabled=1
File1=%InstallDir%\testfile.txt|Marker file
File2=%InstallDir%\data\config.dat|Configuration data
File3=%ProgramData%\<Publisher>\<AppName>\shared.dat|Shared data file

[Registry]
Enabled=1
Entry1=HKCU\Software\<Publisher>\<AppName>|InstallDate|REG_SZ|%DATE%
Entry2=HKCU\Software\<Publisher>\<AppName>|Version|REG_SZ|<Version>
Entry3=HKLM\Software\<Publisher>\<AppName>|InstallPath|REG_SZ|%InstallDir%

[Shortcuts]
Enabled=1
Desktop=1
StartMenu=1
StartMenuFolder=<Publisher>\<AppName>
Pin=0

[FileAssociations]
Enabled=1
Assoc1=.tpkg|TestPackage.Document|TestPackage Document|%InstallDir%\<AppExe>,0
Assoc2=.tpkx|TestPackage.Archive|TestPackage Archive|%InstallDir%\<AppExe>

[AppPaths]
Enabled=1

; everything else off
[ContextMenu]   Enabled=0
[EnvVars]       Enabled=0
[Service]       Enabled=0
[ScheduledTask] Enabled=0
[Firewall]      Enabled=0
[Protocols]     Enabled=0
[ActiveSetup]   Enabled=0
[Startup]       Enabled=0
[Fonts]         Enabled=0
[COM]           Enabled=0
