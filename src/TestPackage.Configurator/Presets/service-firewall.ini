; TestPackage preset: Service + firewall
; NOTE: key names are indicative — map onto the real ConfigModel/ConfigWriter keys.
; Identity is unchanged by presets; presets only set behavior toggles + sample data.

[Files]
Enabled=1
File1=%InstallDir%\testfile.txt|Marker file
File2=%InstallDir%\data\config.dat|Configuration data

[Registry]
Enabled=1
Entry1=HKCU\Software\<Publisher>\<AppName>|InstallDate|REG_SZ|%DATE%
Entry2=HKLM\Software\<Publisher>\<AppName>|InstallPath|REG_SZ|%InstallDir%

[Shortcuts]
Enabled=1
Desktop=1
StartMenu=1

[Service]
Enabled=1
ServiceName=TestPackageSvc
DisplayName=<AppName> Background Service
StartType=Manual

[Firewall]
Enabled=1
Rule1=<AppName> Inbound|In|Allow|TCP|19876
Rule2=<AppName> Outbound|Out|Allow|TCP|19877

[FileAssociations] Enabled=0
[ContextMenu]   Enabled=0
[EnvVars]       Enabled=0
[ScheduledTask] Enabled=0
[Protocols]     Enabled=0
[ActiveSetup]   Enabled=0
[AppPaths]      Enabled=0
[Startup]       Enabled=0
[Fonts]         Enabled=0
[COM]           Enabled=0

; Suggested context: per-machine (service + HKLM + firewall need elevation)
[Install]
DefaultContext=machine
