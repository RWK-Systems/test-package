; =============================================================================
; TestPackage Installer Configuration
; =============================================================================
; This file controls the behavior of the TestPackage installation simulator.
; It is designed for testing repackaging tools, application virtualization,
; and deployment solutions.
;
; Each section controls a different aspect of the installation wizard and
; the actions performed during install/uninstall.
;
; Values: true/false for toggles, strings for paths/text, comma-separated
;         lists where multiple values are accepted.
; =============================================================================

[General]
; Application metadata
AppName=TestPackage
AppVersion=2.5.1
AppPublisher=RWK Systems
AppURL=https://rwksystems.com
AppGUID={E8A3B025-7F4D-4B1A-9C6E-2D8F5A1B3C4D}

; Execution context: User or Admin
; User  = runs without elevation
; Admin = triggers UAC prompt (for testing UAC detection)
RequireAdmin=false

; EXE names for the generated installer output
AppExeName=YourSimulatedApp.exe
InstallerExeName=YourSimulatedSetup.exe

[WizardPages]
; Control which wizard pages are shown during installation
ShowWelcome=true
ShowEULA=true
ShowInstallContext=true
ShowTargetDirectory=true
ShowComponents=true
ShowDesktopShortcut=true
ShowStartMenuPin=true
ShowRebootOption=true
ShowActiveSetup=true

[EULA]
; Custom EULA text (or leave default for a sample EULA)
EULAText=This is a test application provided by RWK Systems for the purpose of testing software repackaging, application virtualization, and deployment solutions. This software is provided "as is" without warranty of any kind. By proceeding, you agree to use this software solely for testing purposes.

[InstallContext]
; Default install context: User or Machine
; If ShowInstallContext=true, the user can change this during install
DefaultContext=Machine

[TargetDirectory]
; Default installation directory
; Supports variables: %ProgramFiles%, %LocalAppData%, %AppData%, %ProgramData%
DefaultPath=%ProgramFiles%\RWK Systems\TestPackage
; Allow user to change the directory in the wizard
AllowCustomPath=true

[Components]
; Define optional components/features the user can select
; Format: ComponentName=DefaultSelected (true/false)
; These create subdirectories and test files under the install directory
CoreFiles=true
SampleDocuments=true
CommandLineTools=false
PluginFramework=false
LocalizationPack=false

[TestFiles]
; Write test files to verify file-system capture
; Paths support variables: %InstallDir%, %ProgramData%, %AppData%,
;   %LocalAppData%, %CommonAppData%, %Desktop%, %CommonDesktop%
Enabled=true
; Comma-separated list of files to create (relative to InstallDir by default)
; Format: path|content  (content is optional, defaults to a marker string)
Files=%InstallDir%\testfile.txt|TestPackage marker file,%InstallDir%\data\config.dat|Configuration data,%ProgramData%\RWK Systems\TestPackage\shared.dat|Shared data file

[Registry]
; Write test registry entries
Enabled=true
; Comma-separated list of registry operations
; Format: RootKey\Path|ValueName|ValueType|ValueData
; RootKey: HKCU, HKLM
; ValueType: REG_SZ, REG_DWORD, REG_EXPAND_SZ, REG_MULTI_SZ
Entries=HKCU\Software\RWK Systems\TestPackage|InstallDate|REG_SZ|%DATE%,HKCU\Software\RWK Systems\TestPackage|Version|REG_SZ|2.5.1,HKLM\Software\RWK Systems\TestPackage|InstallPath|REG_SZ|%InstallDir%

[Shortcuts]
; Desktop shortcut
CreateDesktopShortcut=true
DesktopShortcutName=TestPackage
; Start menu
CreateStartMenuEntry=true
StartMenuFolder=RWK Systems\TestPackage
; Pin to taskbar (Windows 10+)
PinToStartMenu=false

[FileAssociations]
; Register file type associations
Enabled=false
; Format: Extension|ProgID|Description|Icon
Associations=.tpkg|TestPackage.Document|TestPackage Document|%InstallDir%\TestPackageApp.exe,0,.tpkx|TestPackage.Archive|TestPackage Archive|%InstallDir%\TestPackageApp.exe,1

[ContextMenu]
; Add shell context menu entries
Enabled=false
; Format: Extension|MenuText|Command
; Use * for all files, Directory for folders
Entries=*|Open with TestPackage|"%InstallDir%\TestPackageApp.exe" "%1",Directory|Scan with TestPackage|"%InstallDir%\TestPackageApp.exe" --scan "%1"

[EnvironmentVariables]
; Set environment variables
Enabled=false
; Format: Scope|Name|Value  (Scope: User or System)
Variables=User|TESTPACKAGE_HOME|%InstallDir%,User|TESTPACKAGE_VERSION|2.5.1

[Services]
; Install a Windows service (requires Admin)
Enabled=false
ServiceName=TestPackageSvc
ServiceDisplayName=TestPackage Background Service
ServiceDescription=A test service for validating service capture in repackaging tools
; ServiceStartType: Automatic, Manual, Disabled
ServiceStartType=Manual

[ScheduledTasks]
; Create a scheduled task
Enabled=false
TaskName=TestPackage Maintenance
TaskDescription=A test scheduled task for validating task capture
; Schedule: Daily, Weekly, AtLogon, AtStartup
TaskSchedule=Daily
TaskTime=12:00

[FirewallRules]
; Add Windows Firewall rules (requires Admin)
Enabled=false
; Format: Name|Direction|Action|Protocol|Port
; Direction: In, Out  |  Action: Allow, Block
Rules=TestPackage Inbound|In|Allow|TCP|19876,TestPackage Outbound|Out|Allow|TCP|19877

[ProtocolHandlers]
; Register custom URI protocol handlers
Enabled=false
; Format: Protocol|Description
Protocols=testpkg|TestPackage Protocol Handler

[ActiveSetup]
; Active Setup registration (per-user setup on next login)
Enabled=false
StubPath=%InstallDir%\TestPackageApp.exe --activesetup
Version=1,0,0,0

[AppPaths]
; Register in App Paths for direct execution from Run dialog
Enabled=true
; The executable name that can be typed in the Run dialog
ExeName=TestPackageApp.exe

[Startup]
; Add to Windows startup
Enabled=false
; Method: Registry or StartupFolder
Method=Registry
; Scope: User or Machine
Scope=User

[Fonts]
; Install a test font
Enabled=false
; Path to font file (included in package)
FontFile=assets\TestPackageFont.ttf
FontName=TestPackage Font

[COMRegistration]
; Register a test COM object
Enabled=false
CLSID={A1B2C3D4-E5F6-7890-ABCD-EF1234567890}
ProgID=TestPackage.TestObject
Description=TestPackage COM Test Object

[Uninstall]
; Uninstall behavior
; RegisterUninstaller: adds to Add/Remove Programs
RegisterUninstaller=true
; CleanFiles: remove all test files on uninstall
CleanFiles=true
; CleanRegistry: remove all test registry entries on uninstall
CleanRegistry=true
; CleanShortcuts: remove shortcuts on uninstall
CleanShortcuts=true
; IntentionallyLeaveFiles: for testing incomplete uninstall detection
IntentionallyLeaveFiles=false
; Files to leave behind (if IntentionallyLeaveFiles=true)
LeftoverFiles=%InstallDir%\leftover.dat,%ProgramData%\RWK Systems\leftover.log
; IntentionallyLeaveRegistry: for testing incomplete uninstall detection
IntentionallyLeaveRegistry=false
; Registry entries to leave behind (if IntentionallyLeaveRegistry=true)
LeftoverRegistry=HKCU\Software\RWK Systems\TestPackage\Leftover|OrphanedKey|REG_SZ|This was intentionally left behind

[Reboot]
; Reboot behavior
PromptForReboot=false
; ForceReboot: actually reboot (use with caution!)
ForceReboot=false

[InstallerSize]
; Sets the size of the generated setup .exe.
; When enabled, the Configurator pads the generated installer EXE to SizeMB so
; you can test how repackaging/virtualization tools handle large installers.
; At install time the installer also verifies the target drive has enough free
; space before proceeding.
; The default is disabled / 0 (smallest possible installer). If SizeMB is
; smaller than the base installer, the EXE is left unpadded.
; SizeMB accepts 0 up to 102400 (100 GB); larger values are clamped.
Enabled=false
SizeMB=0

[UI]
; Installer UI customization
BannerColor=#0078D4
AccentColor=#106EBE
ShowProgressBar=true
SimulateInstallDelay=true
; Delay in milliseconds (per step) to simulate realistic install time
InstallDelayMs=500
