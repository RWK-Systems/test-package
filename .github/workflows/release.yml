name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without leading v). E.g. 3.0.0-alpha.1'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Determine version, tag and pre-release flag
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ inputs.version }}".TrimStart('v').Trim()
          $tag = "v$version"
        } else {
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
        }
        $isPrerelease = $version -match '-'
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "TAG=$tag" >> $env:GITHUB_OUTPUT
        echo "PRERELEASE=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
        Write-Host "Releasing version=$version tag=$tag prerelease=$isPrerelease from ref=${{ github.ref }}"

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create and push tag (dispatch mode)
      if: github.event_name == 'workflow_dispatch'
      shell: pwsh
      run: |
        $tag = "${{ steps.version.outputs.TAG }}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        $existing = git tag --list $tag
        if ([string]::IsNullOrEmpty($existing)) {
          git tag -a $tag -m "Release $tag"
          git push origin $tag
          Write-Host "Created and pushed tag $tag at $(git rev-parse HEAD)"
        } else {
          Write-Host "Tag $tag already exists at $(git rev-list -n 1 $tag); leaving as-is."
        }

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and run smoke test
      run: |
        dotnet publish src\TestPackageSmokeTest\TestPackageSmokeTest.csproj -c Release -r win-x64 --self-contained false -o dist\smoketest
        copy config.ini dist\smoketest\config.ini
        dist\smoketest\TestPackageSmokeTest.exe 2>&1 | tee dist\smoke-test-output.txt
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Build templates (Self-contained)
      run: |
        dotnet publish src\TestPackageApp\TestPackageApp.csproj -c Release -r win-x64 --self-contained true -o dist\self-contained\templates
        dotnet publish src\TestPackageInstaller\TestPackageInstaller.csproj -c Release -r win-x64 --self-contained true -o dist\self-contained\templates
        copy config.ini dist\self-contained\templates\config.ini

    - name: Build Configurator (Self-contained)
      run: |
        dotnet publish src\TestPackage.Configurator\TestPackage.Configurator.csproj -c Release -r win-x64 --self-contained true -o dist\self-contained\configurator
        xcopy dist\self-contained\templates dist\self-contained\configurator\templates\ /E /I /Y

    - name: Install NSIS
      run: choco install nsis -y --no-progress

    - name: Sign executables before packaging
      if: vars.AZURE_SIGNING_ENABLED == 'true'
      uses: azure/trusted-signing-action@v0.5.0
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files-folder: dist\self-contained
        files-folder-filter: exe
        files-folder-depth: 4
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Build NSIS installer
      run: |
        & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer\test-package-setup.nsi

    - name: Sign NSIS installer
      if: vars.AZURE_SIGNING_ENABLED == 'true'
      uses: azure/trusted-signing-action@v0.5.0
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files-folder: dist
        files-folder-filter: exe
        files-folder-depth: 1
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Compute installer SHA256
      id: hash
      shell: pwsh
      run: |
        $hash = (Get-FileHash "dist\TestPackageSetup.exe" -Algorithm SHA256).Hash
        echo "SHA256=$hash" >> $env:GITHUB_OUTPUT
        echo "Installer SHA256: $hash"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.TAG }}
        name: TestPackage v${{ steps.version.outputs.VERSION }}
        body: |
          ## TestPackage v${{ steps.version.outputs.VERSION }}

          Design and generate simulated installers for testing repackaging, application virtualization, and deployment solutions.

          ### v3 in progress

          Pre-release builds (`vX.Y.Z-alpha.N`) are UX-revamp iterations of the Configurator. They install alongside the stable v2.5 line by upgrading the same registered product; use the stable release (marked "Latest") for regular workflows. Highlights across v3 so far:

          - **Single-screen Configurator** — the 7-tab layout is gone; identity, wizard, install actions, uninstall, appearance and package settings all live on one canvas, with a live "receipt" rail showing the footprint your generated installer will leave.
          - **Presets** — start from Blank, Typical desktop app, Service + firewall, or Enterprise; presets replace install-action behaviors + sample data while leaving your identity/wizard/uninstall settings alone.
          - **Modernist visual system** — flat, architectural, single accent, 2px rules, zero corner radius.
          - Carried forward from v2.5.1: configurable installer size (non-linear slider + MB), disk-space check, derived install path & Start Menu folder, silent install with command-line overrides.

          The composite-field editor overlay (registry / env vars / firewall / etc.) and full visual polish arrive in later alpha builds.

          ### Download

          **[TestPackageSetup.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.TAG }}/TestPackageSetup.exe)** — Self-contained installer (no .NET runtime required)

          ### Install via winget

          ```
          winget install RWKSystems.TestPackage
          ```

          winget tracks the stable release; use the download link above for pre-release alpha builds.

          ### SHA256
          ```
          ${{ steps.hash.outputs.SHA256 }}
          ```

          For more information, visit the [product page](https://www.rwksystems.com/test-package/).
        files: dist/TestPackageSetup.exe
        draft: false
        prerelease: ${{ steps.version.outputs.PRERELEASE == 'true' }}
