name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without leading v). E.g. 3.0.1 or 3.1.0-beta.1'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

defaults:
  run:
    # Fail fast: multi-command pwsh blocks must abort on any error, including
    # native command exit codes. Without this a silent compile failure would
    # ride through to signing and produce a broken release.
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Determine version, tag and pre-release flag
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ inputs.version }}".TrimStart('v').Trim()
          $tag = "v$version"
        } else {
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
        }
        $isPrerelease = $version -match '-'
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "TAG=$tag" >> $env:GITHUB_OUTPUT
        echo "PRERELEASE=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
        Write-Host "Releasing version=$version tag=$tag prerelease=$isPrerelease from ref=${{ github.ref }}"

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create and push tag (dispatch mode)
      if: github.event_name == 'workflow_dispatch'
      shell: pwsh
      run: |
        $tag = "${{ steps.version.outputs.TAG }}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        $existing = git tag --list $tag
        if ([string]::IsNullOrEmpty($existing)) {
          git tag -a $tag -m "Release $tag"
          git push origin $tag
          Write-Host "Created and pushed tag $tag at $(git rev-parse HEAD)"
        } else {
          Write-Host "Tag $tag already exists at $(git rev-list -n 1 $tag); leaving as-is."
        }

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and run smoke test
      run: |
        $ErrorActionPreference = 'Stop'
        dotnet publish src\TestPackageSmokeTest\TestPackageSmokeTest.csproj -c Release -r win-x64 --self-contained false -o dist\smoketest
        if ($LASTEXITCODE) { exit 1 }
        copy config.ini dist\smoketest\config.ini
        if ($LASTEXITCODE) { exit 1 }
        dist\smoketest\TestPackageSmokeTest.exe 2>&1 | tee dist\smoke-test-output.txt
        if ($LASTEXITCODE) { exit 1 }

    - name: Build templates (Self-contained)
      run: |
        $ErrorActionPreference = 'Stop'
        dotnet publish src\TestPackageApp\TestPackageApp.csproj -c Release -r win-x64 --self-contained true -o dist\self-contained\templates
        if ($LASTEXITCODE) { exit 1 }
        dotnet publish src\TestPackageInstaller\TestPackageInstaller.csproj -c Release -r win-x64 --self-contained true -o dist\self-contained\templates
        if ($LASTEXITCODE) { exit 1 }
        copy config.ini dist\self-contained\templates\config.ini
        if ($LASTEXITCODE) { exit 1 }

    - name: Build Configurator (Self-contained)
      run: |
        $ErrorActionPreference = 'Stop'
        dotnet publish src\TestPackage.Configurator\TestPackage.Configurator.csproj -c Release -r win-x64 --self-contained true -o dist\self-contained\configurator
        if ($LASTEXITCODE) { exit 1 }
        xcopy dist\self-contained\templates dist\self-contained\configurator\templates\ /E /I /Y
        if ($LASTEXITCODE) { exit 1 }

    - name: Install NSIS
      run: choco install nsis -y --no-progress

    - name: Sign executables before packaging
      if: vars.AZURE_SIGNING_ENABLED == 'true'
      uses: azure/trusted-signing-action@v0.5.0
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files-folder: dist\self-contained
        files-folder-filter: exe
        files-folder-depth: 4
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Build NSIS installer
      run: |
        & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer\test-package-setup.nsi

    - name: Sign NSIS installer
      if: vars.AZURE_SIGNING_ENABLED == 'true'
      uses: azure/trusted-signing-action@v0.5.0
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files-folder: dist
        files-folder-filter: exe
        files-folder-depth: 1
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Compute installer SHA256
      id: hash
      shell: pwsh
      run: |
        $hash = (Get-FileHash "dist\TestPackageSetup.exe" -Algorithm SHA256).Hash
        echo "SHA256=$hash" >> $env:GITHUB_OUTPUT
        echo "Installer SHA256: $hash"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.TAG }}
        name: TestPackage v${{ steps.version.outputs.VERSION }}
        body: |
          ## TestPackage v${{ steps.version.outputs.VERSION }}

          Design and generate simulated installers for testing repackaging, application virtualization, and deployment solutions.

          ### What's new in v3

          - **Single-screen Configurator.** The 7-tab layout is gone; identity, wizard, install actions, uninstall, appearance and package settings all live on one canvas.
          - **Live "receipt" rail.** A summary on the right side updates as you edit — behaviors enabled, installer size, elevation, install directory, and a one-line description of what the generated installer will do.
          - **Frame navigation tiles.** Six tiles across the top of the workspace; click one to jump to that section, and the currently-visible section is highlighted as you scroll.
          - **Presets.** Start from Blank, Typical desktop app, Service + firewall, or Enterprise. Applying a preset replaces the install-action behaviors and their sample data while leaving your identity, wizard pages and uninstall settings alone.
          - **Composite editors.** Registry entries, environment variables, firewall rules, file associations, context menu entries, protocol handlers and test files each now get a proper master-list + detail-form overlay in place of the inline pipe-format row grids.
          - **Code signing option.** Sign the generated installer with your own PFX (via `signtool.exe` if available on PATH / Windows Kits, or PowerShell `Set-AuthenticodeSignature` as a fallback); leave the mode as "None" to ship it unsigned.
          - **Configurable installer size.** Pad the generated setup .exe up to 100 GB with a non-linear slider + exact MB entry, to test how repackaging and virtualization tools handle large installers. Install-time disk-space check runs against the requested size.
          - **Auto-derived defaults.** Default install path and Start Menu folder follow `<Publisher>\<AppName>` live as you type. Type your own to opt out; clear the field to re-derive.
          - **Modernist visual system.** Flat, architectural, single accent (`#EC3013`), 2px rules, zero corner radius.
          - **Elevation by default.** New installers request administrator privileges by default (matches the reality of Program Files and HKLM writes). Uncheck "Require Administrator" in the Identity frame for user-scope installers.
          - **New defaults:** installer .exe name auto-dated (`TestPackage_DDMMMYY.exe`), installed-payload .exe name reads `TestSetupAuditViewer.exe` (matches the "audit viewer" copy).
          - Carried forward from v2: silent install with command-line overrides (`/S`, `/D=`, `/context=`, `/components=`), configurable app metadata, custom EULA, banner and accent colors, disk-space prerequisite check.

          Existing v2 configuration files (`config.ini`) load unchanged; nothing in the config schema was removed.

          ### Download

          **[TestPackageSetup.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.TAG }}/TestPackageSetup.exe)** — a standalone Windows installer. The .NET 8 runtime is bundled inside the .exe, so nothing else needs to be installed first — just download and run.

          ### Install via winget

          ```
          winget install RWKSystems.TestPackage
          ```

          ### SHA256
          ```
          ${{ steps.hash.outputs.SHA256 }}
          ```

          For more information, visit the [product page](https://www.rwksystems.com/test-package/).
        files: dist/TestPackageSetup.exe
        draft: false
        prerelease: ${{ steps.version.outputs.PRERELEASE == 'true' }}
