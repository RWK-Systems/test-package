name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and run smoke test
      run: |
        dotnet publish src\TestPackageSmokeTest\TestPackageSmokeTest.csproj -c Release -r win-x64 --self-contained false -o dist\smoketest
        copy config.ini dist\smoketest\config.ini
        dist\smoketest\TestPackageSmokeTest.exe 2>&1 | tee dist\smoke-test-output.txt
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Build (Self-contained)
      run: |
        dotnet publish src\TestPackageApp\TestPackageApp.csproj -c Release -r win-x64 --self-contained true -o dist\self-contained
        dotnet publish src\TestPackageInstaller\TestPackageInstaller.csproj -c Release -r win-x64 --self-contained true -o dist\self-contained
        copy config.ini dist\self-contained\config.ini
        copy readme.txt dist\self-contained\readme.txt

    - name: Install NSIS
      run: choco install nsis -y --no-progress

    - name: Sign executables before packaging
      if: vars.AZURE_SIGNING_ENABLED == 'true'
      uses: azure/trusted-signing-action@v0.5.0
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files-folder: dist\self-contained
        files-folder-filter: exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Build NSIS installer
      run: |
        & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer\test-package-setup.nsi

    - name: Sign NSIS installer
      if: vars.AZURE_SIGNING_ENABLED == 'true'
      uses: azure/trusted-signing-action@v0.5.0
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files-folder: dist
        files-folder-filter: exe
        files-folder-depth: 1
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Compute installer SHA256
      id: hash
      shell: pwsh
      run: |
        $hash = (Get-FileHash "dist\TestPackageSetup_v${{ steps.version.outputs.VERSION }}.exe" -Algorithm SHA256).Hash
        echo "SHA256=$hash" >> $env:GITHUB_OUTPUT
        echo "Installer SHA256: $hash"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Test Package v${{ steps.version.outputs.VERSION }}
        body: |
          ## Test Package v${{ steps.version.outputs.VERSION }}

          A configurable Windows installation simulator for testing repackaging, application virtualization, and deployment solutions.

          ### Download

          **[TestPackageSetup_v${{ steps.version.outputs.VERSION }}.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/TestPackageSetup_v${{ steps.version.outputs.VERSION }}.exe)** — Self-contained installer (no .NET runtime required)

          ### Install via winget

          ```
          winget install RWKSystems.TestPackage
          ```

          ### SHA256
          ```
          ${{ steps.hash.outputs.SHA256 }}
          ```

          ### What's included
          - `TestPackageInstaller.exe` — Installation simulator wizard
          - `config.ini` — Feature configuration file
          - `readme.txt` — Documentation

          For more information, visit the [product page](https://www.rwksystems.com/test-package/).
        files: dist/TestPackageSetup_v${{ steps.version.outputs.VERSION }}.exe
        draft: false
        prerelease: false

    # Uncomment after initial winget submission is accepted and WINGET_CREATE_PAT secret is set.
    # The PAT needs public_repo scope on a GitHub account that can fork microsoft/winget-pkgs.
